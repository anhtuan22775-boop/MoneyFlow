<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MoneyFlow</title>
<meta name="description" content="Quản lý dòng tiền Thông Minh - Hiện Đại - Chuyên Nghiệp">
<meta name="theme-color" content="#0e7c66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MoneyFlow">
<style>
:root{
  --bg:#f3f6f4;--card:#fff;--ink:#14201c;--muted:#5d6d67;--line:#dfe6e2;--soft:#eaf0ed;
  --brand:#0e7c66;--brand-ink:#fff;--brand-soft:#dcf1eb;
  --pos:#0a7d45;--neg:#c2410c;--warn:#a15c07;--warn-bg:#fff3d6;--danger:#b42318;--danger-bg:#fde7e4;
  --shadow:0 1px 2px rgba(20,32,28,.06),0 4px 16px rgba(20,32,28,.05);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1412;--card:#171f1c;--ink:#e8f0ed;--muted:#98a9a3;--line:#27332f;--soft:#1e2925;
  --brand:#3cc7a6;--brand-ink:#04231c;--brand-soft:#16352d;
  --pos:#4fd38a;--neg:#fb9a5a;--warn:#f5c46a;--warn-bg:#3a2c0e;--danger:#ff8f85;--danger-bg:#3d1a17;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme=dark]{
  --bg:#0e1412;--card:#171f1c;--ink:#e8f0ed;--muted:#98a9a3;--line:#27332f;--soft:#1e2925;
  --brand:#3cc7a6;--brand-ink:#04231c;--brand-soft:#16352d;
  --pos:#4fd38a;--neg:#fb9a5a;--warn:#f5c46a;--warn-bg:#3a2c0e;--danger:#ff8f85;--danger-bg:#3d1a17;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.25}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--muted)}
.hide{display:none!important}

/* Ảnh nền + hiệu ứng kính mờ (Liquid Glass) */
#bg{position:fixed;inset:-24px;z-index:-1;display:none;background-size:cover;background-position:center;filter:blur(10px)}
#bg::after{content:"";position:absolute;inset:0;background:rgba(128,128,128,.3);background:color-mix(in srgb,var(--bg) var(--veil,58%),transparent)}
body.glass #bg{display:block}
body.glass{--ga:74%;--gb:22px;--veil:58%;--soft:color-mix(in srgb,var(--ink) 9%,transparent);--line:color-mix(in srgb,var(--ink) 15%,transparent);--edge:color-mix(in srgb,#fff 38%,transparent)}
body.glass.b1{--ga:86%;--gb:12px;--veil:68%}body.glass.b3{--ga:60%;--gb:34px;--veil:46%}
body.glass .card,body.glass #side,body.glass #tabs,body.glass .sheet,body.glass .lbox{background:color-mix(in srgb,var(--card) var(--ga),transparent);-webkit-backdrop-filter:blur(var(--gb)) saturate(1.8);backdrop-filter:blur(var(--gb)) saturate(1.8);border-color:var(--edge);box-shadow:inset 0 1px 0 var(--edge),inset 0 -1px 0 rgba(0,0,0,.04),0 10px 32px rgba(0,0,0,.14)}
body.glass .lbox{padding:28px 22px;border:1px solid var(--edge);border-radius:24px}
body.glass .card{border-radius:20px}
body.glass #top{background:color-mix(in srgb,var(--bg) 65%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6)}
body.glass .monthnav,body.glass .sync,body.glass .btn:not(.pri):not(.dan),body.glass input,body.glass select,body.glass .quick button{background:color-mix(in srgb,var(--card) 80%,transparent);border-color:var(--edge)}
body.glass .sheet{background:color-mix(in srgb,var(--card) 92%,transparent)}
body.glass .seg button.on{background:color-mix(in srgb,var(--card) 80%,transparent)}
body.glass #tabs{border-top-color:var(--edge)}
body.glass th:first-child,body.glass td:first-child,body.glass thead th{background:var(--card)}
body.glass{--muted:color-mix(in srgb,var(--ink) 82%,var(--bg))}
body.glass #main>.row>.muted{color:var(--ink);background:color-mix(in srgb,var(--card) 82%,transparent);padding:4px 10px;border-radius:12px}
.btn.scanbtn{width:100%;justify-content:flex-start;gap:12px;margin-bottom:12px;padding:10px 14px;text-align:left;border:1.5px dashed var(--brand);background:var(--brand-soft);color:var(--ink)}
.scanbtn>span:first-child{font-size:26px}.scanbtn b{display:block}.scanbtn small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.scanbtn.busy>span:first-child{animation:pulse 1s infinite}
.ask{position:fixed;inset:0;z-index:90;background:rgba(8,14,12,.55);display:grid;place-items:center;padding:20px;animation:fadeIn .15s ease}.ask.out{opacity:0;transition:opacity .15s}
.askbox{background:var(--card);color:var(--ink);border-radius:20px;padding:22px 20px 18px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:sheetIn .2s cubic-bezier(.2,.8,.2,1)}
.askic{width:54px;height:54px;border-radius:50%;background:var(--danger-bg);display:grid;place-items:center;font-size:26px;margin:0 auto 10px}
.askbox h3{font-size:17px;line-height:1.35}.askbox p{color:var(--muted);font-size:14px;margin:8px 0 0}.askbox .askd{color:var(--ink);font-weight:600}
.btn.dan.solid{background:var(--danger);border-color:var(--danger);color:#fff}
.ledsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}.ledsum>div{background:var(--soft);border-radius:10px;padding:7px 8px;min-width:0}.ledsum small{display:block;font-size:11.5px;color:var(--muted)}.ledsum b{display:block;font-size:13.5px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.item .ic.ledd{display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.05;font-size:15px;color:var(--ink)}.item .ic.ledd small{font-size:10px;color:var(--muted);font-weight:600}
@media (max-width:420px){.ledsum{grid-template-columns:repeat(2,1fr)}}
.bizchk{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);cursor:pointer}
.bizchk input{width:20px;height:20px;min-height:0;margin-top:0;flex:none;accent-color:var(--brand)}.bizchk b{display:block;font-size:14.5px}.bizchk small:empty{display:none}.bizchk small{display:block;color:var(--muted);font-size:12.5px}
.item .am small{white-space:nowrap}
.limrow{display:flex;align-items:center;gap:10px;padding:5px 0}.limrow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.limrow input{width:150px;flex:none;text-align:right;font-variant-numeric:tabular-nums;min-height:38px;padding:7px 10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:58px;height:58px;border-radius:14px;border:2px solid var(--line);background-size:cover;background-position:center;font-size:11.5px;font-weight:700;color:var(--muted);padding:0;overflow:hidden}
.swatches button.on{border-color:var(--brand);outline:2px solid var(--brand);outline-offset:1px}
@media print{#bg{display:none!important}body.glass .card{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}}

/* Hiệu ứng khi nhấn / tương tác */
button{position:relative;overflow:hidden;transition:transform .13s ease,background-color .16s ease,box-shadow .16s ease,filter .16s ease,border-color .16s ease}
button:active:not(:disabled){transform:scale(.95)}
button.item:active{transform:scale(.985)}
#tabs .fab:active{transform:scale(.88)}
.btn.pri:hover,#tabs .fab:hover{box-shadow:0 6px 18px rgba(14,124,102,.32)}
.card{transition:transform .18s ease,box-shadow .18s ease}
@media (hover:hover){.stat:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,32,28,.10)}}
input,select{transition:border-color .16s ease,box-shadow .16s ease}
input:focus,select:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
#modal.on{animation:fadeIn .16s ease}
#modal.on .sheet{animation:sheetIn .24s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetIn{from{transform:translateY(28px);opacity:0}}
#main.enter>*{animation:rise .28s ease both}
#main.enter>*:nth-child(2){animation-delay:.04s}#main.enter>*:nth-child(3){animation-delay:.08s}#main.enter>*:nth-child(n+4){animation-delay:.12s}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.bar i{transition:width .5s cubic-bezier(.2,.8,.2,1)}
#toast{transition:opacity .2s,transform .2s;transform:translate(-50%,8px)}#toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Khung */
#app{min-height:100%;display:flex}
#side{width:232px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 10px 16px}
.brand i{width:36px;height:36px;display:block;flex:none;filter:drop-shadow(0 2px 4px rgba(20,40,80,.18))}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:0;background:none;text-align:left;width:100%;color:var(--muted);font-weight:600}
.nav svg{width:20px;height:20px;flex:none}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--brand-soft);color:var(--brand)}
#side .grow{flex:1}
#wrap{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:14px 22px;position:sticky;top:0;background:var(--bg);z-index:5}
#top h1{font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#main{padding:4px 22px 40px;max-width:1120px;width:100%;margin:0 auto}
#tabs{display:none}
.sync{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--muted)}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok b{background:var(--pos)}.sync.err b{background:var(--danger)}.sync.busy b{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* Thành phần */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;gap:14px}.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}
.stat small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.stat strong{display:block;font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dan{color:var(--danger);border-color:var(--danger-bg);background:var(--danger-bg)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:0;font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.mt{margin-top:14px}
.monthnav{display:inline-flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.monthnav button{border:0;background:none;width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--muted)}
.monthnav button:hover{background:var(--soft)}
.monthnav span{min-width:108px;text-align:center;font-weight:700}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.warn i{background:#e0a020}.bar.over i{background:var(--danger)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.over{background:var(--danger-bg);color:var(--danger)}.pill.ok{background:var(--brand-soft);color:var(--brand)}
.note{border-radius:12px;padding:11px 13px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warn-bg);color:var(--warn)}.note.over{background:var(--danger-bg);color:var(--danger)}.note.info{background:var(--brand-soft);color:var(--brand)}
.note b{font-weight:700}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
button.item:hover{background:var(--soft);border-radius:8px}
.item .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none;font-weight:700;color:var(--muted);font-size:13px}
.item .ic{font-size:18px}.item .ic.sm{width:30px;height:30px;font-size:15px;border-radius:9px}
.flabel{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.icons{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px 10px}
.icons small{display:block;color:var(--muted);font-size:12px;margin:8px 0 4px}
.icons div{display:flex;flex-wrap:wrap;gap:4px}
.icons button{width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:var(--soft);font-size:19px;padding:0}
.icons button.on{border-color:var(--brand);background:var(--brand-soft);outline:2px solid var(--brand)}
.item .ic.in{background:var(--brand-soft);color:var(--pos)}.item .ic.out{background:var(--danger-bg);color:var(--neg)}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tx small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .am{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.item .am small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.irow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.irow:last-child{border-bottom:0}.irow .item{border-bottom:0;flex:1;min-width:0}
.note{align-items:center}
.sideuser{display:flex;align-items:center;gap:10px;padding:8px 12px;font-weight:600;font-size:14px;min-width:0}.sideuser span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.av{border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden;line-height:1}.av img{width:100%;height:100%;object-fit:cover}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px;max-height:300px;overflow:auto;padding:2px}
.avjob{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px}.avjob small{flex:1 1 100%;font-size:12px;color:var(--muted);line-height:1.3}
.avpick{width:48px;height:48px;border-radius:50%;border:3px solid transparent;font-size:26px;padding:0;display:grid;place-items:center}.avpick.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.avc{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0}.avc.on{border-color:var(--ink)}
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);padding:14px 4px 4px;text-transform:uppercase;letter-spacing:.03em}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{flex:1 1 130px;min-width:0}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:42px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
label.f{display:block;margin-top:12px}
label.f>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 2px;font-size:14px;white-space:nowrap;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.amt{font-size:26px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;font-size:13px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);max-width:170px;overflow:hidden;text-overflow:ellipsis}
thead th{background:var(--soft);font-size:12.5px;color:var(--muted);position:sticky;top:0}
thead th:first-child{background:var(--soft)}
tr.grp td{font-weight:700;background:var(--soft)}tr.grp td:first-child{background:var(--soft)}
tr.tot td{font-weight:700}
tr:last-child td{border-bottom:0}

/* Hộp thoại */
#modal{position:fixed;inset:0;background:rgba(8,14,12,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
.sheet{background:var(--card);border-radius:18px;width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet.wide{max-width:640px}
.sheet h2{font-size:17px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:18px}
.acts .btn{flex:1}
#toast{position:fixed;left:50%;bottom:92px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#modal.on ~ #toast{bottom:auto;top:calc(14px + env(safe-area-inset-top))}
#toast.err{background:var(--danger);color:#fff}
.ferr{border-color:var(--danger)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 22%,transparent)!important;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Đăng nhập */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;width:100%}
.lbox{max-width:400px;width:100%;text-align:center}
.lbox .logo{width:84px;height:84px;margin:0 auto 16px;filter:drop-shadow(0 6px 14px rgba(20,40,80,.22))}
.lbox h1{font-size:26px}
.lbox p{color:var(--muted);margin:8px 0 22px}
#gbtn{display:flex;justify-content:center;min-height:44px}

/* Biểu đồ */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

@media (max-width:899px){
  #side{display:none}
  #top{padding:12px 16px}
  #main{padding:2px 16px calc(96px + env(safe-area-inset-bottom))}
  #tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}

/* =============== TÍNH TOÁN =============== */
function balances() {
  const b = {};
  live('accounts').forEach(a => b[a.id] = Number(a.opening) || 0);
  live('transactions').forEach(t => {
    const v = Number(t.amount) || 0;
    if (t.type === 'income' || t.type === 'adjust') { if (t.accountId in b) b[t.accountId] += v; }
    else if (t.type === 'expense') { if (t.accountId in b) b[t.accountId] -= v; }
    else if (t.type === 'transfer') { if (t.accountId in b) b[t.accountId] -= v; if (t.toAccountId in b) b[t.toAccountId] += v; }
    else if (t.type === 'bizin') { if (t.accountId in b) b[t.accountId] += v; if (t.toAccountId in b) b[t.toAccountId] += v; }
    else if (t.type === 'bizout' || t.type === 'bizret') { if (t.accountId in b) b[t.accountId] -= v; if (t.toAccountId in b) b[t.toAccountId] -= v; }
  });
  return b;
}
function totals(bal) {
  const g = { money: 0, goal: 0, save: 0, asset: 0, debt: 0, company: 0, hold: 0 };
  live('accounts').forEach(a => { const k = (ATYPES[a.type] || ATYPES.cash).g; g[k] += bal[a.id] || 0; });
  // Tiền công ty đang nằm trong tài khoản của anh không phải của anh: trừ ra (nếu công ty nợ anh thì cộng vào)
  g.net = g.money + g.goal + g.save + g.asset + g.debt - g.company - g.hold;
  return g;
}
/** Tổng thu/chi theo tháng và theo danh mục. Chuyển tiền và cập nhật giá trị KHÔNG tính vào thu chi. */
function monthSum(month) {
  const r = { inc: 0, exp: 0, cat: {} };
  live('transactions').forEach(t => {
    if (!t.date || !t.date.startsWith(month)) return;
    const v = Number(t.amount) || 0;
    if (t.type === 'income') { r.inc += v; r.cat[t.categoryId || ''] = (r.cat[t.categoryId || ''] || 0) + v; }
    else if (t.type === 'expense') { r.exp += v; r.cat[t.categoryId || ''] = (r.cat[t.categoryId || ''] || 0) + v; }
  });
  return r;
}
function budgetMap(month) {
  const m = {};
  live('budgets').forEach(b => { if (b.month === '*' && !(b.categoryId in m)) m[b.categoryId] = Number(b.amount) || 0; });
  live('budgets').forEach(b => { if (b.month === month) m[b.categoryId] = Number(b.amount) || 0; });
  return m;
}
const cats = kind => live('categories').filter(c => c.kind === kind).sort((a, b) => (a.sort || 0) - (b.sort || 0));
function groupsOf(list) { const g = []; list.forEach(c => { let x = g.find(y => y.name === (c.group || 'Khác')); if (!x) g.push(x = { name: c.group || 'Khác', items: [] }); x.items.push(c); }); return g; }
function catName(id) { const c = S.categories.find(x => x.id === id); return c ? c.name : 'Chưa phân loại'; }
function accName(id) { const a = S.accounts.find(x => x.id === id); return a ? a.name : 'Tài khoản đã xóa'; }
function budgetAlerts(month) {
  const ms = monthSum(month), bm = budgetMap(month), th = setting('alertPct', 80), out = [];
  cats('expense').forEach(c => {
    const b = bm[c.id] || 0, s = ms.cat[c.id] || 0;
    if (b <= 0) return;
    const p = s / b * 100;
    if (s > b) out.push({ c, b, s, p, lv: 'over' }); else if (p >= th) out.push({ c, b, s, p, lv: 'warn' });
  });
  return out.sort((a, b) => b.p - a.p);
}
function dueAlerts(bal) {
  const now = new Date(), out = [];
  live('accounts').forEach(a => {
    const d = Number(a.dueDay) || 0, owe = -(bal[a.id] || 0);
    if (!isDebt(a) || d < 1 || owe <= 0) return;
    let due = new Date(now.getFullYear(), now.getMonth(), Math.min(d, new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate()));
    if (iso(due) < iso(now)) due = new Date(now.getFullYear(), now.getMonth() + 1, Math.min(d, new Date(now.getFullYear(), now.getMonth() + 2, 0).getDate()));
    const days = Math.round((new Date(iso(due)) - new Date(iso(now))) / 864e5);
    if (days <= 7) out.push({ a, owe, days, due });
  });
  return out.sort((x, y) => x.days - y.days);
}

/* =============== MÁY CHỦ & ĐỒNG BỘ =============== */
async function api(action, payload) {
  const res = await fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, token: session }, payload || {})) });
  const j = await res.json();
  if (!j.ok) { const e = new Error(j.error || 'Có lỗi xảy ra'); e.code = j.code; throw e; }
  return j;
}
let syncing = false, syncAgain = false, syncT;
function setSync(st, txt) { const b = $('#sync'); b.className = 'sync ' + st; $('span', b).textContent = txt; }
function dirtyCount() { let n = 0; TABLES.forEach(t => n += Object.keys(S.dirty[t] || {}).length); return n; }
function scheduleSync() { if (demo) return; setSync(navigator.onLine ? 'busy' : 'err', navigator.onLine ? 'Chờ đồng bộ' : 'Ngoại tuyến'); clearTimeout(syncT); syncT = setTimeout(sync, 1500); }
async function sync(full) {
  if (demo || !session) return;
  if (syncing) { syncAgain = true; return; }
  if (!navigator.onLine) { setSync('err', 'Ngoại tuyến' + (dirtyCount() ? ' · ' + dirtyCount() + ' chờ gửi' : '')); return; }
  syncing = true; setSync('busy', 'Đang đồng bộ');
  try {
    let more = true, first = true;
    while (more) {
      const snap = {}, changes = {}; let n = 0;
      for (const t of TABLES) {
        const d = S.dirty[t] || {};
        for (const id in d) {
          if (n >= 300) break;
          const r = S[t].find(x => x.id === id);
          if (!r) { delete d[id]; continue; }
          (changes[t] = changes[t] || []).push(r); (snap[t] = snap[t] || {})[id] = d[id]; n++;
        }
      }
      const since = full && first ? 0 : S.lastSync;
      const res = await api('sync', { since, changes });
      for (const t in snap) for (const id in snap[t]) if (S.dirty[t][id] === snap[t][id]) delete S.dirty[t][id];
      for (const t of TABLES) {
        const d = S.dirty[t] || {};
        if (since === 0) S[t] = S[t].filter(r => d[r.id]);
        const idx = new Map(S[t].map((r, i) => [r.id, i]));
        for (const r of (res.data[t] || [])) {
          if (d[r.id]) continue;
          if (idx.has(r.id)) S[t][idx.get(r.id)] = r; else { idx.set(r.id, S[t].length); S[t].push(r); }
        }
        S[t] = S[t].filter(r => !r.deleted || d[r.id]);
      }
      S.lastSync = res.serverTime; first = false;
      more = n >= 300 && dirtyCount() > 0;
    }
    await flush();
    setSync('ok', 'Đã đồng bộ');
    const ae = document.activeElement;
    if (!(ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName) && $('#main').contains(ae))) render();
  } catch (e) {
    if (e.code === 'AUTH') { session = null; lsSet('stc_session', null); showLogin('Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại, dữ liệu chưa gửi vẫn được giữ.'); }
    else if (e.code === 'PENDING' || e.code === 'BLOCKED') { user.status = e.code === 'PENDING' ? 'pending' : 'blocked'; showLogin(); }
    else setSync('err', e.code ? 'Lỗi đồng bộ' : 'Mất kết nối' + (dirtyCount() ? ' · ' + dirtyCount() + ' chờ gửi' : ''));
    if (e.code && e.code !== 'AUTH') console.error(e);
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; sync(); }
  }
}

function holdDue() {

    const paid = tx.filter(t => t.type === 'bizout').reduce((s, t) => s + (Number(t.amount) || 0), 0), got = tx.filter(t => t.type === 'bizin').reduce((s, t) => s + (Number(t.amount) || 0), 0);

function goalDue() {

/* =============== QUỸ CÔNG TY (TẠM ỨNG) =============== */
function bizMonth(f, m) {
  const r = { start: Number(f.opening) || 0, inn: 0, out: 0, ret: 0, items: [] };
  live('transactions').filter(t => isBiz(t) && t.toAccountId === f.id && t.date).sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt).forEach(t => {
    const v = Number(t.amount) || 0, sign = t.type === 'bizin' ? 1 : -1;
    if (t.date < m + '-01') r.start += sign * v;
    else if (t.date.startsWith(m)) { if (t.type === 'bizin') r.inn += v; else if (t.type === 'bizout') r.out += v; else r.ret += v; r.items.push(t); }
  });
  live('transactions').filter(t => t.type === 'adjust' && t.accountId === f.id && t.date).forEach(t => { if (t.date < m + '-01') r.start += Number(t.amount) || 0; else if (t.date.startsWith(m)) r.inn += Number(t.amount) || 0; });
  r.end = r.start + r.inn - r.out - r.ret;
  return r;
}

  } catch (e) { download(new Blob(['﻿' + rows.map(x => x.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }), name + '.csv'); toast('Đã xuất file CSV (mở được bằng Excel)'); }

function yearData(y) {
  const months = Array.from({ length: 12 }, (_, i) => y + '-' + pad(i + 1));
  const sums = months.map(monthSum), bm = budgetMap('*');
  const row = (label, vals, cls, target) => ({ label, vals, total: vals.reduce((a, b) => a + b, 0), cls: cls || '', target });
  const rows = [];
  const inc = sums.map(s => s.inc), exp = sums.map(s => s.exp);
  rows.push(row('TỔNG THU NHẬP', inc, 'tot')); rows.push(row('TỔNG CHI TIÊU', exp, 'tot')); rows.push(row('CÒN LẠI (Thu − Chi)', inc.map((v, i) => v - exp[i]), 'tot'));
  ['income', 'expense'].forEach(kind => {
    const list = cats(kind).filter(c => !c.archived || sums.some(s => s.cat[c.id]));
    groupsOf(list).forEach(g => {
      const gv = months.map((_, i) => g.items.reduce((a, c) => a + (sums[i].cat[c.id] || 0), 0));
      rows.push(row((kind === 'income' ? 'THU: ' : 'CHI: ') + g.name, gv, 'grp', g.items.reduce((a, c) => a + (bm[c.id] || 0), 0)));
      g.items.forEach(c => rows.push(row(c.name, sums.map(s => s.cat[c.id] || 0), '', bm[c.id] || 0)));
    });
    const un = sums.map(s => { let v = 0; for (const k in s.cat) { const c = S.categories.find(x => x.id === k); if ((!c || c.deleted) && kind === 'expense') v += s.cat[k]; } return v; });
    if (kind === 'expense' && un.some(v => v)) rows.push(row('Chưa phân loại / danh mục đã xóa', un, ''));
  });
  return { months, rows, inc, exp };
}
function chartSvg(inc, exp) {
  const W = 720, H = 220, L = 46, B = 24, T = 10, max = Math.max(1, ...inc, ...exp), sw = (W - L) / 12, bw = Math.min(18, sw / 2 - 4);
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = T + (H - T - B) * (1 - i / 4); g += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${short(max * i / 4)}</text>`; }
  for (let i = 0; i < 12; i++) {
    const cx = L + sw * i + sw / 2, h1 = (H - T - B) * inc[i] / max, h2 = (H - T - B) * exp[i] / max;
    g += `<rect x="${cx - bw - 1}" y="${H - B - h1}" width="${bw}" height="${h1}" rx="3" fill="var(--pos)"><title>T${i + 1} · Thu ${fmt(inc[i])}</title></rect><rect x="${cx + 1}" y="${H - B - h2}" width="${bw}" height="${h2}" rx="3" fill="var(--neg)"><title>T${i + 1} · Chi ${fmt(exp[i])}</title></rect><text x="${cx}" y="${H - 6}" text-anchor="middle">T${i + 1}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Thu và chi theo tháng">${g}</svg>`;
}

    toast(n ? 'Đã lưu hạn mức cho ' + n + ' danh mục' : 'Không có thay đổi'); if (n) render();
  };
  $('#sBlur').value = lsGet('stc_blur') || '2';
  $('#sBlur').onchange = e => { lsSet('stc_blur', e.target.value); applyBg(); };
  $$('#sBg button').forEach(b => b.onclick = async () => { if (b.dataset.bg === 'custom') return $('#sBgFile').click(); lsSet('stc_bg', b.dataset.bg || null); await applyBg(); render(); });
  $('#sBgFile').onchange = e => pickBgImage(e.target.files[0]);
  $('#sExp').onclick = () => exportExcel(ui.year); $('#sCat').onclick = () => catForm();
  if (demo) { $('#sDemo').onclick = async () => { sample(); render(); toast('Đã nạp dữ liệu mẫu'); }; $('#sWipe').onclick = async () => { if (await ask('Bạn chắc chắn muốn xóa toàn bộ dữ liệu dùng thử không?')) { S = blank(); seedLocal(); save(); render(); } }; }
  else $('#sFull').onclick = () => { toast('Đang tải lại…'); sync(true); };
  if (user.isAdmin) { $('#sAdm').onclick = adminLoad; if (ui.admin) adminDraw(); }
  const box = $('#catBox');
  box.innerHTML = ['expense', 'income'].map(k => `<div class="dayhead"><span>${k === 'expense' ? 'Chi tiêu' : 'Thu nhập'}</span></div>` + groupsOf(cats(k)).map(g => `<div style="margin:6px 0"><span class="muted" style="font-size:13px">${esc(g.name)}:</span> ${g.items.map(c => `<button class="btn sm" data-cat="${esc(c.id)}" style="margin:3px 2px;${c.archived ? 'opacity:.5;text-decoration:line-through' : ''}">${catIcon(c)} ${esc(c.name)}</button>`).join('')}</div>`).join('')).join('');
  $$('[data-cat]', box).forEach(b => b.onclick = () => catForm(byId('categories', b.dataset.cat)));
}
function catForm(c) {
  const isNew = !c; c = c ? Object.assign({}, c) : { id: 'c_' + uid(), name: '', kind: 'expense', group: '', sort: live('categories').length + 1, archived: 0 };
  const used = !isNew && live('transactions').some(t => t.categoryId === c.id);
  const groups = Array.from(new Set(live('categories').map(x => x.group).filter(Boolean)));
  modal(`<h2>${isNew ? 'Thêm danh mục' : 'Sửa danh mục'}<button class="x" data-x>×</button></h2>
    <label class="f"><span>Tên danh mục</span><input id="cName" maxlength="60" value="${esc(c.name)}"></label>
    <label class="f"><span>Loại</span><select id="cKind" ${used ? 'disabled' : ''}><option value="expense">Chi tiêu</option><option value="income" ${c.kind === 'income' ? 'selected' : ''}>Thu nhập</option></select></label>
    <label class="f"><span>Nhóm (chọn nhóm có sẵn hoặc gõ tên nhóm mới)</span><input id="cGroup" list="cGroups" maxlength="60" value="${esc(c.group)}"><datalist id="cGroups">${groups.map(g => `<option value="${esc(g)}">`).join('')}</datalist></label>
    <div class="f"><span class="flabel">Biểu tượng: <b id="cIcoNow" style="font-size:20px"></b> <button class="link" id="cAuto" type="button">Tự chọn theo tên</button></span>
      <div class="icons">${ICON_SETS.map(g => `<small>${g[0]}</small><div>${g[1].split(' ').map(e => `<button type="button" data-e="${e}">${e}</button>`).join('')}</div>`).join('')}</div></div>
    ${isNew ? '' : `<label class="row" style="margin-top:12px"><input type="checkbox" id="cArc" style="width:auto;min-height:0" ${c.archived ? 'checked' : ''}> Ẩn danh mục này khi nhập giao dịch</label>`}
    <div class="acts">${isNew ? '' : '<button class="btn dan" id="cDel">Xóa</button>'}<button class="btn pri" id="cSave">Lưu</button></div>`);
  let picked = !!c.icon, ico = c.icon || guessIcon(c.name, c.kind);
  const showIco = () => { $('#cIcoNow').textContent = ico; $$('.icons button').forEach(b => b.classList.toggle('on', b.dataset.e === ico)); };
  $$('.icons button').forEach(b => b.onclick = () => { ico = b.dataset.e; picked = true; showIco(); });
  $('#cAuto').onclick = () => { picked = false; ico = guessIcon($('#cName').value, $('#cKind').value); showIco(); };
  $('#cName').oninput = () => { if (!picked) { ico = guessIcon($('#cName').value, $('#cKind').value); showIco(); } };
  showIco();
  $('#cSave').onclick = () => {
    c.name = $('#cName').value.trim(); if (!c.name) return toast('Nhập tên danh mục'); c.icon = ico;
    c.kind = $('#cKind').value; c.group = $('#cGroup').value.trim() || (c.kind === 'income' ? 'Thu nhập' : 'Khác'); if (!isNew) c.archived = $('#cArc').checked ? 1 : 0;
    put('categories', c); closeModal(); render(); toast('Đã lưu');
  };
  if (!isNew) $('#cDel').onclick = async () => { if (used) return toast('Danh mục đã có giao dịch. Hãy chọn “Ẩn” thay vì xóa.'); if (await ask('Bạn chắc chắn muốn xóa danh mục “' + c.name + '” không?')) { remove('categories', c.id); closeModal(); render(); } };
}
async function adminLoad() { const b = $('#admBox'); b.textContent = 'Đang tải…'; try { ui.admin = await api('adminList'); adminDraw(); } catch (e) { b.textContent = e.message; } }
function adminDraw() {
  const b = $('#admBox'); if (!b) return; const st = { active: ['Đang dùng', 'ok'], pending: ['Chờ duyệt', 'warn'], blocked: ['Đã khóa', 'over'] };
  const act = ui.admin.users.filter(u => u.status === 'active').length;
  b.className = ''; b.innerHTML = `<div class="muted" style="font-size:13px;margin-bottom:6px">Đang dùng ${act}/${ui.admin.max} tài khoản</div><div class="list">` + ui.admin.users.map(u => `<div class="item"><span class="tx"><b>${esc(u.name || u.email)}${u.isAdmin ? ' <span class="pill">Quản trị</span>' : ''}</b><small>${esc(u.email)}</small></span><span class="pill ${st[u.status] ? st[u.status][1] : ''}">${st[u.status] ? st[u.status][0] : esc(u.status)}</span>${u.isAdmin ? '' : u.status === 'active' ? `<button class="btn sm dan" data-u="${esc(u.email)}" data-s="blocked">Khóa</button>` : `<button class="btn sm pri" data-u="${esc(u.email)}" data-s="active">${u.status === 'pending' ? 'Duyệt' : 'Mở khóa'}</button>`}</div>`).join('') + '</div>';
  $$('[data-u]', b).forEach(x => x.onclick = async () => { x.disabled = true; try { ui.admin = await api('adminSet', { email: x.dataset.u, status: x.dataset.s }); adminDraw(); toast('Đã cập nhật'); } catch (e) { toast(e.message); x.disabled = false; } });
}
function sample() {
  const set = (id, o) => { const a = byId('accounts', id); if (a) put('accounts', Object.assign({}, a, o), true); };
  set('a_tienmat', { opening: 6000000 }); set('a_nganhang', { opening: 24000000 }); set('a_momo', { opening: 5000000 }); set('a_tindung', { limit: 30000000, dueDay: new Date().getDate() + 3 > 28 ? 5 : new Date().getDate() + 3 });
  put('accounts', { id: 'a_demo_tk', name: 'Sổ tiết kiệm 6 tháng', type: 'saving', opening: 50000000, limit: 0, dueDay: 0, note: '', archived: 0, sort: 6 }, true);
  put('accounts', { id: 'a_demo_vay', name: 'Vay mua xe', type: 'loan', opening: -18000000, limit: 0, dueDay: 15, note: '', archived: 0, sort: 7 }, true);
  const now = new Date(); let n = 0;
  const add = (date, type, amount, accountId, categoryId, note, toAccountId) => put('transactions', { id: 'demo' + (n++), date, type, amount, accountId, toAccountId: toAccountId || '', categoryId: categoryId || '', note: note || '', createdAt: Date.now() + n }, true);
  for (let k = 3; k >= 0; k--) {
    const m = addMonth(ymOf(today()), -k), last = k === 0 ? now.getDate() : 28, day = d => m + '-' + pad(Math.min(d, last));
    add(day(1), 'income', 19365000, 'a_nganhang', 'c_luong', 'Lương');
    add(day(2), 'expense', 5500000, 'a_nganhang', 'c_thuenha', 'Tiền nhà');
    add(day(3), 'expense', 2500000, 'a_nganhang', 'c_quy', '');
    add(day(3), 'transfer', 3000000, 'a_nganhang', '', 'Gửi tiết kiệm', 'a_demo_tk');
    add(day(5), 'transfer', 1000000, 'a_nganhang', '', 'Trả gốc', 'a_demo_vay');
    [[4, 650000, 'c_sinhhoat', 'a_momo'], [7, 320000, 'c_xang', 'a_tienmat'], [9, 185000, 'c_coffee', 'a_momots'], [12, 870000, 'c_sinhhoat', 'a_tindung'], [14, 450000, 'c_party', 'a_tindung'], [17, 760000 + k * 90000, 'c_sinhhoat', 'a_tindung'], [19, 120000, 'c_coffee', 'a_momo'], [21, 300000, 'c_sach', 'a_tindung'], [23, 540000 + (3 - k) * 160000, 'c_sinhhoat', 'a_nganhang'], [25, 150000, 'c_tuthien', 'a_tienmat'], [26, 380000, 'c_gd_an', 'a_tienmat']]
      .forEach(x => { if (x[0] <= last) add(day(x[0]), 'expense', x[1], x[3], x[2], ''); });
    if (k > 0) add(day(27), 'transfer', 1800000, 'a_nganhang', '', 'Thanh toán thẻ', 'a_tindung');
  }
  save();
}

/* Gợn sóng lan ra từ điểm nhấn + rung nhẹ trên điện thoại */
document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('button'); if (!b || b.disabled) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.2, sp = document.createElement('span');
  sp.className = 'rip'; sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  b.appendChild(sp); setTimeout(() => sp.remove(), 600);
  if (e.pointerType === 'touch' && navigator.vibrate && b.matches('.pri,.fab,.dan')) { try { navigator.vibrate(8); } catch (x) {} }
}, { passive: true });

/* =============== KHỞI ĐỘNG =============== */
window.addEventListener('online', () => sync()); window.addEventListener('offline', () => { if (!demo && session) setSync('err', 'Ngoại tuyến'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); else if (session && Date.now() - S.lastSync > 60000) sync(); });
setInterval(() => { if (!document.hidden) sync(); }, 5 * 60000);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
(async function boot() {
  applyTheme(); await idb.open(); applyBg();
  session = lsGet('stc_session'); try { user = JSON.parse(lsGet('stc_user') || 'null'); } catch (e) { user = null; }
  if (READY && session && user && user.status === 'active') start(); else showLogin();
})();
</script>
